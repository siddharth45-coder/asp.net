const D=[
{q:"Differentiate Client-Side and Server-Side Scripting",t:"Client-side runs in the browser; server-side runs on the web server and sends back plain HTML.",tb:[["Point","Client-Side","Server-Side"],["Runs on","Browser","Web server"],["Languages","JavaScript, HTML, CSS","C#, PHP, Java, Python"],["Speed","Fast UI, no round trip","Needs request/response"],["Security","Code visible to user","Code hidden"],["DB access","No (direct)","Yes"],["Use","Validation, animation","Login, DB, business logic"]],f:["Client-Side","Browser","HTML + CSS + JS","UI, validation","|  vs  |","Server-Side","Web server","C# / PHP","DB, security"],m:"Client = Customer’s side (browser). Server = Serves data.",x:[["Introduction","Web applications use scripts that run either in the user’s browser or on the web server. Choosing correctly affects speed, security and functionality."],["Client-Side Scripting","Code is sent with the page and executed by the browser. Languages: HTML, CSS, JavaScript. Used for form validation, animations, menus and instant feedback without contacting the server. Advantages: fast response, less server load. Disadvantages: code is visible to the user, no direct database access, depends on browser support."],["Server-Side Scripting","Code runs on the web server, which processes the request, talks to the database and returns plain HTML. Languages: C# (ASP.NET), PHP, Java, Python. Advantages: code is hidden and secure, database access, works on any browser. Disadvantages: every action needs a request–response trip, so it is slower and loads the server."],["Differences","Write the table: runs on, languages, speed, security, database access, typical use."],["Conclusion","Modern sites use both: client-side for a smooth interface and server-side for secure data processing."]]},
{q:"Explain Client-Side and Server-Side Scripting with a Diagram",t:"Browser sends a request; server runs code and returns HTML; browser then runs JS on it.",f:["Browser (Client)","HTTP Request","Web Server","Run C# / DB query","HTML Response","Browser renders + JS runs"],p:["Client-side: HTML, CSS, JavaScript executes in browser","Server-side: ASP.NET code executes on IIS/Kestrel","User never sees server code, only output"],x:[["Introduction","Client-side and server-side scripting are the two halves of a web application. Together they handle the user interface and the data processing."],["Working (follow the diagram)","1) The user types a URL or submits a form in the browser. 2) The browser sends an HTTP request to the web server. 3) The server runs the server-side code (ASP.NET/C#), queries the database if needed and builds an HTML page. 4) The server sends the HTML response back. 5) The browser renders the page and runs client-side JavaScript on it."],["Client-Side Scripting","Executes in the browser. Handles validation, animation and interactivity without a server round trip. Code is visible to the user."],["Server-Side Scripting","Executes on the server (IIS/Kestrel). Handles business logic, authentication and database operations. Only the output is visible; source code stays secret."],["Conclusion","Client-side improves user experience; server-side provides security and data handling. Both are needed for a complete web application."]]},
{q:"Architecture and Components of .NET Framework",t:".NET Framework = CLR + Class Library (FCL), sitting on the OS, supporting many languages.",l:["Applications: Web Forms · WinForms · WPF · Console","ASP.NET · ADO.NET · WCF","Base Class Library (FCL)","CLR (CLR runs, JIT, GC, security)","CTS + CLS (type/language rules)","Operating System"],p:["CLR: runtime, memory management, garbage collection, security","FCL/BCL: ready-made classes (System.IO, System.Data…)","CTS: common data types · CLS: language rules","Languages: C#, VB.NET, F# all compile to MSIL"],m:"CLR runs it, FCL gives tools.",x:[["Introduction",".NET Framework is a software platform from Microsoft for building and running Windows and web applications. Programs in many languages compile to a common intermediate code and run under one runtime."],["1. Common Language Runtime (CLR)","The execution engine. It loads assemblies, JIT-compiles MSIL to native code, manages memory with garbage collection, handles exceptions, thread management and security."],["2. Framework Class Library (FCL/BCL)","A large collection of reusable classes and namespaces such as System, System.IO, System.Data and System.Web. It saves development time."],["3. CTS and CLS","Common Type System defines data types shared by all .NET languages. Common Language Specification defines the rules every language must follow so that languages can interoperate."],["4. Languages and Application Types","C#, VB.NET and F# compile to MSIL. Application layers include ASP.NET (web), ADO.NET (data), WinForms/WPF (desktop), WCF (services)."],["5. Operating System Layer","The framework sits on the OS, which talks to hardware. See the layered diagram above."],["Conclusion","The architecture gives language independence, automatic memory management and a rich library, making development faster and safer."]]},
{q:"Applications and Features of ASP.NET",t:"ASP.NET is Microsoft’s framework for building dynamic web apps, APIs and services.",p:["Applications: websites, e-commerce, web APIs, enterprise portals, PWAs","Compiled code → fast performance","Multi-language support (C#, VB)","State management: Session, Cookies, ViewState","Built-in security: authentication/authorization","Caching, master pages, validation controls","Easy deployment, rich tool support (Visual Studio)","Separation of code and design (code-behind)"]},
{q:"CLR, MSIL and JIT with Relationship to OS and Hardware",t:"Source → MSIL (portable) → JIT converts to machine code → runs on hardware via OS.",f:["C# Source","Compiler","MSIL + Metadata","CLR loads","JIT Compiler","Native Machine Code","OS → Hardware"],p:["CLR: runtime engine; manages memory, security, exceptions","MSIL: CPU-independent intermediate code (also called IL/CIL)","JIT: compiles MSIL to native code at runtime, per method, only when called","Result: same code runs on any OS/hardware with a CLR"],m:"Compile → IL → JIT → Native."},
{q:"What is an Assembly? Explain its Types",t:"Assembly = compiled unit of deployment (.dll or .exe) holding MSIL, metadata and resources.",tb:[["Type","Meaning"],["Private","Used by one app, stored in app folder"],["Shared","Used by many apps, stored in GAC, needs strong name"],["Satellite","Holds only resources (language/culture)"],["Static","Created at compile time, stored on disk"],["Dynamic","Created at runtime in memory (Reflection.Emit)"]]},
{q:"Explain GAC (Global Assembly Cache)",t:"GAC is a machine-wide store for shared assemblies so many apps can use one copy.",p:["Location: C:\\Windows\\Microsoft.NET\\assembly","Assemblies need a strong name (name + version + culture + public key token)","Supports side-by-side versioning (avoids DLL Hell)","Add with gacutil -i MyLib.dll","Benefits: one copy, security, versioning · Drawback: admin rights needed"]},
{q:"Components of an Assembly",t:"Four parts: Manifest, Metadata, MSIL code, Resources.",l:["Manifest – name, version, culture, references","Type Metadata – classes, methods, members","MSIL Code – compiled instructions","Resources – images, strings, files"],m:"M-M-M-R (Manifest, Metadata, MSIL, Resources)."},

{q:"C#: Area of Circle, Rectangle, Square and Factorial (Recursion)",t:"Use formulas πr², l×b, s×s; factorial calls itself until n = 1.",c:`double circle = Math.PI * r * r;
double rect   = l * b;
double square = s * s;

static int Fact(int n)
{
    if (n <= 1) return 1;     // base case
    return n * Fact(n - 1);   // recursive call
}
